name: Rust foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p llmesh -- --version
      - run: cargo build --locked -p llmesh-web --target wasm32-unknown-unknown --release
      - run: cargo build --locked -p llmesh --no-default-features --features sovereign
      - name: Ensure mutually exclusive editions
        shell: bash
        run: |
          if cargo check --locked -p llmesh --features sovereign; then
            echo 'Community and Sovereign must not coexist'; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rust-foundation-${{ matrix.os }}
          path: |
            rust/target/wasm32-unknown-unknown/release/llmesh_web.wasm
            rust/target/debug/llmesh
            rust/target/debug/llmesh.exe
  dependency-policy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
